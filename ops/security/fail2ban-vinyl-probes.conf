[Definition]
# Only failed requests to explicit scanner targets. Never count media,
# thumbnails, API pagination, playback or ordinary failed site logins.
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "(?:GET|POST|HEAD) /(?:\.env(?:[._~/-][^ ?]*)?|\.git/(?:config|HEAD)|wp-login\.php|xmlrpc\.php|wp-admin/(?:admin-ajax|setup-config)\.php|cgi-bin/[^ ?]*bin/sh)(?:\?[^ ]*)? HTTP/[0-9.]+" (?:400|403|404|405) \d+
ignoreregex =
